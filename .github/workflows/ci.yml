# ─────────────────────────────────────────────────────────────────────────────
# TalentForge CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Runs on every push to main and on all pull requests.
#
# Jobs:
#   1. backend-tests    — Python pytest suite (recruiter-backend/)
#   2. frontend-checks  — Next.js lint + build (recruiter-ai-agent/frontend/)
#
# Deployment (manual step — configure secrets in repo Settings → Secrets):
#   Backend  → Railway  (set RAILWAY_TOKEN secret)
#   Frontend → Vercel   (set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets)
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Backend Tests
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-tests:
    name: Backend — pytest (recruiter-backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recruiter-backend

    env:
      # Use SQLite in CI — conftest.py overrides get_db to SQLite anyway,
      # but this prevents the startup fallback log from polluting test output.
      DATABASE_URL: "sqlite:///./ci_test.db"
      REDIS_URL: "redis://localhost:6379/0"
      SECRET_KEY: "ci-test-secret-key-do-not-use-in-production"
      ALGORITHM: "HS256"
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: recruiter-backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: |
          PYTHONPATH=. pytest tests/ -v \
            --tb=short \
            --ignore=tests/test_screening_graph.py \
            -x
        # test_screening_graph.py is excluded in CI because it requires
        # a live OpenAI API key. It falls back gracefully but may produce
        # noisy output. Enable it by removing --ignore when OPENAI_API_KEY is set.

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend Lint + Build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-checks:
    name: Frontend — lint + build (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recruiter-ai-agent/frontend

    env:
      # Provide a placeholder so NEXT_PUBLIC_API_URL is defined during build.
      # Vercel will inject the real value via its environment variable settings.
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: recruiter-ai-agent/frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint (next lint)
        run: npm run lint

      - name: Build Next.js production bundle
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3 (Optional): Deploy backend to Railway
  # Uncomment and set RAILWAY_TOKEN secret to enable.
