# ─────────────────────────────────────────────────────────────────────────────
# TalentForge CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Runs on every push to main and on all pull requests.
#
# Jobs:
#   1. backend-tests    — Python pytest suite
#   2. frontend-checks  — Next.js lint + build
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Backend Tests
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-tests:
    name: Backend — pytest (recruiter-backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recruiter-backend

    env:
      DATABASE_URL: "sqlite:///./ci_test.db"
      REDIS_URL: "redis://localhost:6379/0"
      SECRET_KEY: "ci-test-secret-key-do-not-use-in-production"
      ALGORITHM: "HS256"
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: recruiter-backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set Python path
        run: echo "PYTHONPATH=$PWD" >> "$GITHUB_ENV"

      - name: Verify backend structure
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Backend files:"
          ls -la
          echo ""
          echo "App directory:"
          ls -la app
          echo ""
          echo "Python path:"
          echo "$PYTHONPATH"

      - name: Run pytest
        run: |
          pytest tests/ -v \
            --tb=short \
            --ignore=tests/test_screening_graph.py \
            -x

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend Lint + Build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-checks:
    name: Frontend — lint + build (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recruiter-ai-agent/frontend

    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: recruiter-ai-agent/frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js production bundle
        run: npm run build
